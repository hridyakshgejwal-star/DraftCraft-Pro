[package]
name = "draftcraft-core"
version = "1.4.0"
edition = "2021"
authors = ["DraftCraft Systems"]
description = "High-performance native screenplay engine and Final Draft 13 interoperability core in Rust for macOS 27 Golden Gate & Apple Silicon"
license = "MIT OR Apache-2.0"

[lib]
name = "draftcraft_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "draftcraft-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS Foundation and Cocoa bindings for Apple Silicon
# objc = "0.2"
# cocoa = "0.25"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
