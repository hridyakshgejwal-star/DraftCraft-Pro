# DraftCraft Pro for Windows: build the same app from source on a real Windows machine, test it, package it
# (installer + portable zip) and attach both to the GitHub Release for the app's version.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Firebase web settings (Google Drive sync)
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: |
          if ($env:FIREBASE_APPLET_CONFIG) {
            [IO.File]::WriteAllText("$PWD\firebase-applet-config.json", $env:FIREBASE_APPLET_CONFIG)
            Get-Content -Raw firebase-applet-config.json | ConvertFrom-Json | Out-Null
            "Using the FIREBASE_APPLET_CONFIG secret."
          } else {
            Copy-Item firebase-applet-config.example.json firebase-applet-config.json
            "::warning::The FIREBASE_APPLET_CONFIG secret is not set: this build has placeholder Firebase settings, so Google Drive sync will not work."
          }

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      - name: Unit tests (Windows)
        run: node verification/run-unit-tests.mjs

      - name: Build the app (renderer, desktop files, fonts)
        run: node desktop/build.cjs

      - name: Package for Windows x64 (Electron 44.7.0)
        run: |
          node desktop/package.mjs win32 x64
          $app = Resolve-Path "..\desktop-build\packages\DraftCraft Pro-win32-x64"
          "APP_DIR=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $app | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Native self-test of the packaged app
        run: ./desktop/windows/run-self-test.ps1 -Exe "$env:APP_DIR\DraftCraft Pro.exe" -Out "$env:RUNNER_TEMP\selftest"

      - name: Keep the self-test report and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-self-test
          path: ${{ runner.temp }}/selftest/out
          if-no-files-found: warn

      - name: Installer (Inno Setup) and portable zip
        run: |
          $version = (Get-Content -Raw desktop\package.json | ConvertFrom-Json).version
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $dist = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\dist"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { choco install innosetup --no-progress -y | Out-Host }
            $iscc = Get-Item $candidate
          }
          & $iscc.Source "/DAppVersion=$version" "/DSourceDir=$env:APP_DIR" "/DOutputDir=$dist" desktop\windows\DraftCraft-Pro.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          $zipRoot = Join-Path $env:RUNNER_TEMP "zip\DraftCraft Pro"
          New-Item -ItemType Directory -Force -Path $zipRoot | Out-Null
          Copy-Item -Recurse "$env:APP_DIR\*" $zipRoot
          Compress-Archive -Path $zipRoot -DestinationPath "$dist\DraftCraft-Pro-$version-win-x64-portable.zip"
          Push-Location $dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS-windows.txt' | ForEach-Object { "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
          Pop-Location
          "DIST_DIR=$dist" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DraftCraft-Pro-windows-x64
          path: ${{ runner.temp }}/dist
          retention-days: 30

      - name: Attach to the GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = ".github\release-notes\$tag.md"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $notes) { gh release create $tag --target $env:GITHUB_SHA --title "DraftCraft Pro $env:APP_VERSION" --notes-file $notes }
            else { gh release create $tag --target $env:GITHUB_SHA --title "DraftCraft Pro $env:APP_VERSION" --generate-notes }
            if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
          }
          gh release upload $tag (Get-ChildItem "$env:DIST_DIR\*").FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the Windows files failed.' }
          $global:LASTEXITCODE = 0
